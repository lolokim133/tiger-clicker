  const stage = document.getElementById("stage");
  const hitArea = document.getElementById("hitArea");
  const mainImg = document.getElementById("mainImg");
  const countEl = document.getElementById("count");
  let count = 0;
  let isActive = false;

  function positionHitArea() {
    const scaleX = stage.clientWidth / ORIG_W;
    const scaleY = stage.clientHeight / ORIG_H;
    hitArea.style.left = (HEAD_REGION.x * scaleX) + "px";
    hitArea.style.top = (HEAD_REGION.y * scaleY) + "px";
    hitArea.style.width = (HEAD_REGION.w * scaleX) + "px";
    hitArea.style.height = (HEAD_REGION.h * scaleY) + "px";
  }

  function activate() {
    if (!isActive) {
      isActive = true;
      mainImg.src = IMG2;
      count++;
      countEl.textContent = count;
    }
  }

  function deactivate() {
    if (isActive) {
      isActive = false;
      mainImg.src = IMG1;
    }
  }

  hitArea.addEventListener("mousedown", (e) => {
    e.preventDefault();
    activate();
  });
  window.addEventListener("mouseup", deactivate);

  hitArea.addEventListener("touchstart", (e) => {
    e.preventDefault();
    activate();
  }, { passive: false });
  window.addEventListener("touchend", deactivate);
  window.addEventListener("touchcancel", deactivate);

  window.addEventListener("resize", positionHitArea);
  positionHitArea();
</script>
